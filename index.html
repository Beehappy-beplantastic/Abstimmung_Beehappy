<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beehappy - Pflanzen-Abstimmung</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 600px; 
            margin: 20px auto; 
            padding: 20px; 
            background: #f4f9f4; 
            color: #333; 
        }
        .header-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-img {
            max-width: 150px;
            height: auto;
            margin-bottom: 10px;
        }
        h1, h2 { 
            color: #2e7d32; 
            text-align: center; 
        }
        .card { 
            background: white; 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
        .item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        button { 
            background: #4caf50; 
            color: white; 
            border: none; 
            padding: 8px 12px; 
            border-radius: 4px; 
            cursor: pointer; 
        }
        button:disabled { 
            background: #ccc; 
            cursor: not-allowed; 
        }
        button.super { 
            background: #ff9800; 
            margin-left: 5px; 
        }
        button.admin-btn { 
            background: #555; 
            color: white; 
            margin-top: 10px; 
            width: 100%; 
        }
        button.reset-btn { 
            background: #d32f2f; 
            color: white; 
            margin-top: 10px; 
            width: 100%; 
        }
        input[type="text"] { 
            width: 65%; 
            padding: 8px; 
        }
        .info-msg { 
            padding: 10px; 
            background: #e8f5e9; 
            border-left: 4px solid #2e7d32; 
            margin-bottom: 15px; 
        }
        .archive-item { 
            border-bottom: 1px solid #eee; 
            padding: 8px 0; 
        }
        .archive-item:last-child { 
            border-bottom: none; 
        }
        .admin-panel { 
            display: none; 
            background: #fff3e0; 
            border: 1px solid #ffe0b2; 
        }
    </style>

    <!-- Firebase SDKs (inklusive Authentication) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <!-- FingerprintJS IIFE SDK -->
    <script src="https://openfpcdn.io/fingerprintjs/v3/iife.min.js"></script>
</head>
<body>

    <div class="header-container">
        <img src="bee-logo.jpeg" alt="Beehappy Logo" class="logo-img" id="headerLogo">
        <h1>Beehappy 🐝 Pflanzennamen-Wahl</h1>
    </div>

    <div id="statusMessage" class="info-msg">
        Lade Abstimmung...
    </div>

    <!-- Vorschlag einreichen -->
    <div class="card">
        <h3>Neuen Namen vorschlagen</h3>
        <input type="text" id="nameInput" placeholder="Pflanzenname eingeben (max. 30 Zeichen)..." maxlength="30">
        <button id="addBtn" onclick="addName()">Hinzufügen</button>
    </div>

    <!-- Aktuelle Liste der Namen -->
    <h2>Aktuelle Abstimmung</h2>
    <div id="nameList">Lade Abstimmung...</div>

    <!-- Archiv für alte Wochen -->
    <div class="card" style="margin-top: 30px;">
        <h2>📜 Archiv vergangener Wochen</h2>
        <div id="archiveList">
            <small>Noch keine vergangenen Abstimmungen archiviert.</small>
        </div>
    </div>

    <!-- Admin-Bereich -->
    <div style="margin-top: 40px;">
        <button class="admin-btn" onclick="toggleAdminPanel()">⚙️ Admin-Bereich (Lehrer / Orga)</button>
        <div id="adminPanel" class="card admin-panel">
            <h3>Admin-Steuerung</h3>
            <p><small>Hier kannst du die Abstimmung beenden und das Ergebnis archivieren.</small></p>
            <button class="reset-btn" onclick="resetWeeklyVoting()">Woche beenden & Ergebnisse archivieren</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDP1ipt-iW9r0cADFKFXFc502LZlThxJzM",
            authDomain: "beehappy-abstimmung.firebaseapp.com",
            databaseURL: "https://beehappy-abstimmung-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "beehappy-abstimmung",
            storageBucket: "beehappy-abstimmung.firebasestorage.app",
            messagingSenderId: "555575924691",
            appId: "1:555575924691:web:6059bedfc504c06e35c126"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let namesData = {};
        let archiveData = {};
        let votersData = {};
        let currentDeviceId = null;

        function setCookie(name, value, days) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = name + "=" + encodeURIComponent(value) + "; expires=" + date.toUTCString() + "; path=/";
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return decodeURIComponent(c.substring(nameEQ.length, c.length));
            }
            return null;
        }

        function getFallbackDeviceId() {
            let id = localStorage.getItem('beehappy_device_id') || getCookie('beehappy_device_id');
            if (!id) {
                id = 'dev_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
            }
            localStorage.setItem('beehappy_device_id', id);
            setCookie('beehappy_device_id', id, 365);
            return id;
        }

        function initDeviceId() {
            let isLoaded = false;

            const timeout = setTimeout(() => {
                if (!isLoaded) {
                    isLoaded = true;
                    currentDeviceId = getFallbackDeviceId();
                    render();
                }
            }, 1000);

            if (window.FingerprintJS) {
                FingerprintJS.load()
                    .then(fp => fp.get())
                    .then(result => {
                        if (!isLoaded) {
                            isLoaded = true;
                            clearTimeout(timeout);
                            currentDeviceId = 'fp_' + result.visitorId.replace(/[\.\#\$\/\[\]]/g, "_");
                            render();
                        }
                    })
                    .catch(err => {
                        if (!isLoaded) {
                            isLoaded = true;
                            clearTimeout(timeout);
                            currentDeviceId = getFallbackDeviceId();
                            render();
                        }
                    });
            } else {
                if (!isLoaded) {
                    isLoaded = true;
                    clearTimeout(timeout);
                    currentDeviceId = getFallbackDeviceId();
                    render();
                }
            }
        }

        // Live-Synchronisation mit Firebase
        db.ref('names').on('value', snapshot => {
            namesData = snapshot.val() || {};
            render();
        });

        db.ref('voters').on('value', snapshot => {
            votersData = snapshot.val() || {};
            render();
        });

        db.ref('archive').on('value', snapshot => {
            archiveData = snapshot.val() || {};
            renderArchive();
        });

        function hasUserVoted() {
            if (!currentDeviceId) return false;
            return votersData[currentDeviceId] === true;
        }

        function render() {
            const list = document.getElementById('nameList');
            const statusMsg = document.getElementById('statusMessage');
            const addBtn = document.getElementById('addBtn');
            const nameInput = document.getElementById('nameInput');

            if (!currentDeviceId) {
                statusMsg.innerHTML = "Lade Abstimmung... Bitte einen Moment gedulden.";
                addBtn.disabled = true;
                nameInput.disabled = true;
                return;
            }

            const userHasVoted = hasUserVoted();

            if (userHasVoted) {
                statusMsg.innerHTML = "<strong>Aktion ausgeführt!</strong> Du hast bereits abgestimmt oder einen Namen vorgeschlagen. Mit <em>Super-Stimmen</em> kannst du deinen Favoriten weiterhin unterstützen!";
                addBtn.disabled = true;
                nameInput.disabled = true;
            } else {
                statusMsg.innerHTML = "Du kannst <strong>entweder</strong> 1 Stimme abgeben <strong>oder</strong> 1 neuen Namen vorschlagen.";
                addBtn.disabled = false;
                nameInput.disabled = false;
            }

            list.innerHTML = '';
            
            let namesArray = [];
            for (let id in namesData) {
                namesArray.push({ id: id, ...namesData[id] });
            }
            namesArray.sort((a, b) => b.votes - a.votes);

            if (namesArray.length === 0) {
                list.innerHTML = '<small>Noch keine Namensvorschläge vorhanden.</small>';
                return;
            }

            namesArray.forEach(item => {
                const div = document.createElement('div');
                div.className = 'card item';
                div.innerHTML = `
                    <div>
                        <strong>${item.text}</strong><br>
                        <small>Stimmen: ${item.votes}</small>
                    </div>
                    <div>
                        <button onclick="vote('${item.id}')" ${userHasVoted ? 'disabled' : ''}>
                            ${userHasVoted ? 'Gestimmt' : '+1 Stimme'}
                        </button>
                        <button class="super" onclick="buySuperVote('${item.text}')">Super-Stimme (€)</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function renderArchive() {
            const archiveDiv = document.getElementById('archiveList');
            let archiveArray = Object.values(archiveData);

            if (archiveArray.length === 0) {
                archiveDiv.innerHTML = '<small>Noch keine vergangenen Abstimmungen archiviert.</small>';
                return;
            }

            archiveDiv.innerHTML = '';
            archiveArray.reverse().forEach(weekData => {
                const weekContainer = document.createElement('div');
                weekContainer.className = 'archive-item';
                
                let winnerText = weekData.winner ? `🏆 Gewinner: <strong>${weekData.winner.text}</strong> (${weekData.winner.votes} Stimmen)` : 'Keine Stimmen';
                
                weekContainer.innerHTML = `
                    <strong>Woche vom ${weekData.date}:</strong><br>
                    ${winnerText}
                `;
                archiveDiv.appendChild(weekContainer);
            });
        }

        function addName() {
            if (hasUserVoted()) {
                alert("Du hast von diesem Gerät bereits abgestimmt oder einen Vorschlag eingereicht!");
                return;
            }

            const input = document.getElementById('nameInput');
            const text = input.value.trim().substring(0, 30);

            if (text === '') {
                alert("Bitte gib einen Namen ein.");
                return;
            }

            const exists = Object.values(namesData).some(item => item.text.toLowerCase() === text.toLowerCase());
            if (exists) {
                alert("Dieser Pflanzenname wurde bereits vorgeschlagen! Bitte wähle einen anderen Namen oder stimme für den bestehenden ab.");
                return;
            }

            const newRef = db.ref('names').push();
            newRef.set({ text: text, votes: 1 });

            db.ref('voters/' + currentDeviceId).set(true);

            input.value = '';
        }

        function vote(id) {
            if (hasUserVoted()) {
                alert("Du hast von diesem Gerät bereits abgestimmt oder einen Vorschlag eingereicht!");
                return;
            }

            const currentVotes = namesData[id] ? namesData[id].votes : 0;
            db.ref('names/' + id + '/votes').set(currentVotes + 1);

            db.ref('voters/' + currentDeviceId).set(true);
        }

        function buySuperVote(name) {
            alert(`Du wirst nun zur Zahlung weitergeleitet, um eine Super-Stimme für "${name}" zu kaufen und die Pflanze zu sichern.`);
            window.location.href = "https://paypal.me/DEIN_PROJEKTNAME/2"; 
        }

        // Firebase-Authentifizierung für den Admin-Bereich
        async function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            
            if (panel.style.display === 'block') {
                panel.style.display = 'none';
                return;
            }

            // Falls bereits eingeloggt, Panel anzeigen
            if (auth.currentUser) {
                panel.style.display = 'block';
                return;
            }

            // Ansonsten Anmeldedaten abfragen
            const email = prompt("Bitte Admin E-Mail eingeben:");
            if (!email) return;

            const password = prompt("Bitte Admin Passwort eingeben:");
            if (!password) return;

            try {
                await auth.signInWithEmailAndPassword(email.trim(), password.trim());
                alert("Erfolgreich als Admin angemeldet!");
                panel.style.display = 'block';
            } catch (error) {
                alert("Anmeldung fehlgeschlagen: " + error.message);
            }
        }

        // Zurücksetzen mit abgesichertem Firebase-Schreibzugriff
        async function resetWeeklyVoting() {
            if (!auth.currentUser) {
                alert("Du musst als Admin angemeldet sein, um diese Aktion auszuführen!");
                return;
            }

            if (confirm("Möchtest du die aktuelle Woche wirklich beenden? Die Daten werden archiviert und alle Abstimmungen/Sperren zurückgesetzt.")) {
                try {
                    let namesArray = Object.values(namesData);
                    namesArray.sort((a, b) => b.votes - a.votes);
                    let winner = namesArray.length > 0 ? namesArray[0] : null;

                    const today = new Date().toLocaleDateString('de-DE');
                    
                    // Ins Archiv schreiben
                    await db.ref('archive').push({
                        date: today,
                        winner: winner,
                        allResults: namesData
                    });

                    // Aktuelle Runde löschen
                    await db.ref('names').remove();
                    await db.ref('voters').remove();

                    alert("Die Woche wurde erfolgreich zurückgesetzt. Alle Geräte können wieder abstimmen!");
                } catch (error) {
                    alert("Fehler beim Zurücksetzen: " + error.message);
                }
            }
        }

        initDeviceId();
    </script>
</body>
</html>
