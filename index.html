<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beehappy - Pflanzen-Abstimmung</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; background: #f4f9f4; color: #333; }
        h1, h2 { color: #2e7d32; text-align: center; }
        .card { background: white; padding: 15px; margin: 10px 0; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .item { display: flex; justify-content: space-between; align-items: center; }
        button { background: #4caf50; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        button.super { background: #ff9800; margin-left: 5px; }
        button.admin-btn { background: #555; color: white; margin-top: 10px; width: 100%; }
        button.reset-btn { background: #d32f2f; color: white; margin-top: 10px; width: 100%; }
        input[type="text"] { width: 65%; padding: 8px; }
        .info-msg { padding: 10px; background: #e8f5e9; border-left: 4px solid #2e7d32; margin-bottom: 15px; }
        .archive-item { border-bottom: 1px solid #eee; padding: 8px 0; }
        .archive-item:last-child { border-bottom: none; }
        .admin-panel { display: none; background: #fff3e0; border: 1px solid #ffe0b2; }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <!-- SCHRITT 3: Firebase Authentication SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <!-- FingerprintJS IIFE SDK -->
    <script src="https://openfpcdn.io/fingerprintjs/v3/iife.min.js"></script>
</head>
<body>

    <h1>Beehappy 🐝 Pflanzennamen-Wahl</h1>

    <div id="statusMessage" class="info-msg">
        Lade Abstimmung...
    </div>

    <!-- Vorschlag einreichen -->
    <div class="card">
        <h3>Neuen Namen vorschlagen</h3>
        <input type="text" id="nameInput" placeholder="Pflanzenname eingeben (max. 30 Zeichen)..." maxlength="30">
        <button id="addBtn" onclick="addName()">Hinzufügen</button>
    </div>

    <!-- Aktuelle Liste der Namen -->
    <h2>Aktuelle Abstimmung</h2>
    <div id="nameList">Lade Abstimmung...</div>

    <!-- Archiv für alte Wochen -->
    <div class="card" style="margin-top: 30px;">
        <h2>📜 Archiv vergangener Wochen</h2>
        <div id="archiveList">
            <small>Noch keine vergangenen Abstimmungen archiviert.</small>
        </div>
    </div>

    <!-- Versteckter Admin-Bereich -->
    <div style="margin-top: 40px;">
        <button class="admin-btn" onclick="toggleAdminPanel()">⚙️ Admin-Bereich (Lehrer / Orga)</button>
        <div id="adminPanel" class="card admin-panel">
            <h3>Admin-Steuerung</h3>
            <p><small>Hier kannst du die Abstimmung beenden und das Ergebnis archivieren.</small></p>
            <button class="reset-btn" onclick="resetWeeklyVoting()">Woche beenden & Ergebnisse archivieren</button>
        </div>
    </div>
